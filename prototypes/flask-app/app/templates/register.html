{% extends "base.html" %}
{% block title %}注册 · LinkAI 原型{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>注册</h1>
  <form method="post" action="{{ url_for('auth.register') }}">
    <label>邮箱<input type="email" name="email" required autofocus></label>
    <label>昵称<input type="text" name="name" placeholder="选填"></label>
    <label>密码<input type="password" name="password" required minlength="6"></label>
    <button type="submit">注册并登录</button>
  </form>
  <p class="muted">已有账号？<a href="{{ url_for('auth.login') }}">去登录</a></p>
</div>
{% endblock %}
