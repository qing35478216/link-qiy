[project]
name = "linkai-platform"
version = "0.1.0"
description = "LinkAI platform 服务（四层架构：api/services/domain/infra；账户/应用/配额/团队）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # OTel 可观测性（trace_id 贯通为强制约定，见 docs/observability.md）
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    # 账户域（选型见 services/platform/ADOPTED-TOOLS.md）
    "pyjwt>=2.9",          # JWT 签发/校验（MIT，仅 JWS 场景）
    "sqlalchemy>=2.0",     # ORM（只在 infra 层出现）
    "alembic>=1.13",       # 迁移骨架
    "psycopg[binary]>=3.2", # PostgreSQL 驱动（compose 默认值）
    "structlog>=24.1",     # 结构化日志（docs/observability.md 约定）
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.13",
    "black>=24.10",  # 与 ruff format 对齐（line-length=100），双保险
    "httpx>=0.27",   # FastAPI TestClient 依赖
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkai_platform"]

# —— Ruff（lint + format，替代 flake8/isort；format 与 black 双跑，见 ADOPTED-TOOLS.md）——
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # assert 允许用于 pytest
    "RUF001", # 中文注释/文档字符串惯用全角标点，禁止替换
    "RUF002",
    "RUF003",
    "B008",  # FastAPI Depends() 惯用法（参数默认值注入）
]
[tool.ruff.lint.isort]
known-first-party = ["linkai_platform"]

# —— Black（与 ruff format 同配 line-length，避免互相打架）——
[tool.black]
line-length = 100
target-version = ["py312"]

# —— mypy --strict（铁律：Python 全严格类型）——
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["linkai_platform"]
mypy_path = "src"

# —— pytest（领域层覆盖率 ≥70% 为验收线）——
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=linkai_platform.domain --cov-report=term-missing --cov-fail-under=70"
