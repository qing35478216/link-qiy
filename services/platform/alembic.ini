# Alembic 配置：迁移脚本向前兼容（扩展-迁移-收缩三步法，见工单规范）。
# DATABASE_URL 从环境变量读取（alembic/env.py），本文件不存连接串。
[alembic]
script_location = alembic
prepend_sys_path = src
# 时间戳迁移编号，与多开发者并行开发兼容
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d_%%(rev)s
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
