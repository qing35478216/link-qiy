[project]
name = "linkai-billing"
version = "0.1.0"
description = "LinkAI billing 服务（四层架构：api/services/domain/infra；积分钱包/统一计量原子扣减/订单/配额/对账）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # OTel 可观测性（trace_id 贯通为强制约定，见 docs/observability.md）
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    # 账户/订单域（选型见 services/billing/ADOPTED-TOOLS.md）
    "pyjwt>=2.9",           # JWT 校验（与 platform 共享密钥，MIT）
    "sqlalchemy>=2.0",      # ORM（只在 infra 层出现）
    "alembic>=1.13",        # 迁移骨架
    "psycopg[binary]>=3.2", # PostgreSQL 驱动（compose 默认值）
    "structlog>=24.1",      # 结构化日志（docs/observability.md 约定）
    # Redis Streams：计量事件流水（XADD/XREADGROUP/XACK）+ 对账数据源
    # 选型核查（铁律 8）：redis-py 为 Redis 官方维护（MIT，7.1.0 于 2025-11 发版），
    # 支持 Redis 7.x/8.x 与 Python 3.12；详见 ADOPTED-TOOLS.md §4
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",  # FastAPI TestClient 依赖（platform 同款）
    # fakeredis（BSD-3-Clause，2.28.x 活跃维护）：纯 Python 实现的 redis-py 替身，
    # 25/25 Stream 命令可用（XADD/XREADGROUP/XPENDING/XACK/XRANGE），
    # 使 Redis 路径（事件流水/对账）测试无需真实 Redis 服务器。详见 ADOPTED-TOOLS.md §5
    "fakeredis>=2.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkai_billing"]

# —— Ruff（lint + format，替代 flake8/isort/black 组合）——
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # assert 允许用于 pytest
    "RUF001", # 中文注释/文档字符串惯用全角标点，禁止替换
    "RUF002",
    "RUF003",
    "B008",  # FastAPI Depends() 惯用法（参数默认值注入）
]

[tool.ruff.lint.per-file-ignores]
# 测试里出现 assert / 假凭证字符串 / 随机数是正常用法
"tests/**" = ["S105", "S106", "S311", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["linkai_billing"]

# —— mypy --strict（铁律：Python 全严格类型）——
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["linkai_billing"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
# 架构守卫（铁律 2）：domain 层不得 import 任何框架/基础设施
disallow_any_unimported = true
warn_unreachable = true

# —— pytest（领域层覆盖率 ≥70% 为验收线；资金域按双人评审标准执行）——
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=linkai_billing.domain --cov-report=term-missing --cov-fail-under=70"
