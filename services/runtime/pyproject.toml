[project]
name = "linkai-runtime"
version = "0.1.0"
description = "LinkAI runtime 服务（四层架构：api/services/domain/infra；对话引擎：上下文装配 + SSE 流式 + Runtime Event 协议）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # OTel 可观测性（trace_id 贯通为强制约定，见 docs/observability.md）
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    # 出网 HTTP 客户端（BSD-3-Clause）：调 model-proxy / platform 的唯一通道
    "httpx>=0.27",
    # 持久化（ORM 只出现在 infra 层；迁移走 alembic，与 platform 同构）
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # 结构化日志（docs/observability.md 约定）
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "black>=24.10",  # 与 ruff format 对齐（line-length=100），双保险
    "respx>=0.22",   # httpx mock（回放用例不触网）
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkai_runtime"]

# —— Ruff（lint + format，替代 flake8/isort/black 组合）——
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # assert 允许用于 pytest
    "RUF001", # 中文注释/文档字符串惯用全角标点，禁止替换
    "RUF002",
    "RUF003",
    "B008",  # FastAPI Depends() 惯用法（参数默认值注入）
]
[tool.ruff.lint.isort]
known-first-party = ["linkai_runtime"]

# —— Black（与 ruff format 同配 line-length，避免互相打架）——
[tool.black]
line-length = 100
target-version = ["py312"]

# —— mypy --strict（铁律：Python 全严格类型）——
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["linkai_runtime"]
mypy_path = "src"
# pydantic 插件：让 mypy 理解 Field(alias=...) 与 populate_by_name，
# 否则按 snake_case 构造 DTO 会被误报（契约字段是 camelCase）
plugins = ["pydantic.mypy"]
# 架构守卫（铁律 2）：domain 层不得 import 任何框架/基础设施
disallow_any_unimported = true
warn_unreachable = true

# —— pytest（领域层覆盖率 ≥70% 为验收线，Phase 0 建议值）——
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov=linkai_runtime.domain --cov-report=term-missing --cov-fail-under=70"
