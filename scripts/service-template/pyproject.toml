[project]
name = "linkai-__SERVICE_NAME__"
version = "0.1.0"
description = "LinkAI __SERVICE_NAME__ 服务（四层架构：api/services/domain/infra）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # OTel 可观测性（trace_id 贯通为强制约定，见 docs/observability.md）
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkai___MODULE__"]

# —— Ruff（lint + format，替代 flake8/isort/black 组合）——
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]  # assert 允许用于 pytest
[tool.ruff.lint.isort]
known-first-party = ["linkai___MODULE__"]

# —— mypy --strict（铁律：Python 全严格类型）——
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["linkai___MODULE__"]
mypy_path = "src"

# —— pytest（领域层覆盖率 ≥70% 为验收线）——
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=linkai___MODULE__.domain --cov-report=term-missing --cov-fail-under=70"
