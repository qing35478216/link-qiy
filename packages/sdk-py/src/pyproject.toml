[tool.poetry]
name = "link-ai-console-api管理面-client"
version = "0.1.0"
description = "A client library for accessing LinkAI Console API（管理面）"
authors = []
readme = "README.md"
packages = [
    { include = "link_ai_console_api管理面_client" },
]
include = ["link_ai_console_api管理面_client/py.typed"]

[tool.poetry.dependencies]
python = "^3.11"
httpx = ">=0.23.1,<0.29.0"
attrs = ">=22.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
