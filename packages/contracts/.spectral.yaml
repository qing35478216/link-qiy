# LinkAI 契约治理规则集
#
# 定位：把 AGENTS.md「架构铁律」里可被机器判定的部分，下沉为 CI 门禁。
# 用法：npm run lint        （error 级失败）
#       npm run lint:strict （warn 级也失败，冻结契约前用这个）
#
# 规则来源：
#   - spectral:oas        OpenAPI 3.x 官方规范校验（基础盘）
#   - linkai-*            本项目定制规则（见下方分组注释）

extends: [[spectral:oas, all]]

rules:
  # ─────────────────────────────────────────────────────────────
  # 分组 1：可生成性（契约先行 → 生成物必须干净）
  # 没有 operationId，sdk-ts / sdk-py 生成出来的方法名就是噪声。
  # ─────────────────────────────────────────────────────────────
  linkai-operation-id-exists:
    description: 每个操作必须有 operationId，否则生成的 SDK 方法名不可控。
    given: $.paths[*][get,post,put,patch,delete,head,options]
    severity: error
    then:
      field: operationId
      function: truthy

  # 注：operationId 唯一性由 spectral:oas 的 operation-operationId-unique 提供，
  #     继承后无需自定义（其内部函数 oasOpIdUnique 不对外注册）。
  linkai-operation-id-casing:
    description: operationId 使用 camelCase，与 TS / Python SDK 命名风格对齐。
    given: $.paths[*][get,post,put,patch,delete,head,options].operationId
    severity: warn
    then:
      function: casing
      functionOptions:
        type: camel

  # ─────────────────────────────────────────────────────────────
  # 分组 2：多租户穿透（架构铁律 #6）
  # ─────────────────────────────────────────────────────────────
  linkai-tenant-context-declared:
    description: >
      架构铁律 #6：所有数据操作带 tenant_id，不准裸查询。
      契约层要求：操作须在 parameters 中声明 tenant 标识
      （X-Tenant-Id 请求头，或 tenantId 路径/查询参数）。
      确属公共服务的（健康检查、登录、定价页等），用 x-public: true 显式豁免。
    # 两个坑，都踩过：
    # 1) x-public 必须加引号，否则 JSONPath 解析成 x 减 public 的算术表达式；
    # 2) 方法筛选不能写成 [get,post][?(...)]——第二个 filter 会作用在 operation 的
    #    子键上（operationId/summary/...），导致同一问题重复报多次。
    #    正确做法：方法名与豁免条件写在同一个 filter 里，@ 即 operation 对象。
    given: "$.paths[*][?((@property === 'get' || @property === 'post' || @property === 'put' || @property === 'patch' || @property === 'delete') && @['x-public'] !== true)]"
    severity: warn
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [parameters]
          properties:
            parameters:
              type: array
              contains:
                type: object
                required: [name]
                properties:
                  name:
                    enum: [X-Tenant-Id, tenantId, tenant_id]

  # ─────────────────────────────────────────────────────────────
  # 分组 3：错误处理契约（客户端要能穷举失败分支）
  # ─────────────────────────────────────────────────────────────
  linkai-error-response-4xx:
    description: >
      有输入的操作必须声明 4xx 响应，客户端才能穷举错误处理分支。
      无参数的探针类接口（如 healthz）豁免。
    given: "$.paths[*][?((@property === 'get' || @property === 'post' || @property === 'put' || @property === 'patch' || @property === 'delete') && (@.requestBody || @.parameters))]"
    # Phase 0 提速（甲方指令：进度优先）：v0.1 允许错误分支后补，降为 warn；冻结前用 lint:strict 兜底
    severity: warn
    then:
      field: responses
      function: schema
      functionOptions:
        schema:
          type: object
          properties:
            "400": { type: object }
            "401": { type: object }
            "403": { type: object }
            "404": { type: object }
            "409": { type: object }
            "422": { type: object }
          anyOf:
            - required: ["400"]
            - required: ["401"]
            - required: ["403"]
            - required: ["404"]
            - required: ["409"]
            - required: ["422"]

  linkai-error-response-5xx:
    description: 每个操作必须声明 5xx 响应（通常为 500）。
    given: $.paths[*][get,post,put,patch,delete]
    # Phase 0 提速（甲方指令：进度优先）：v0.1 允许错误分支后补，降为 warn；冻结前用 lint:strict 兜底
    severity: warn
    then:
      field: responses
      function: schema
      functionOptions:
        schema:
          type: object
          anyOf:
            - required: ["500"]
            - required: ["502"]
            - required: ["503"]

  linkai-error-envelope-shape:
    description: >
      错误响应体必须统一为 { code, message, requestId } 信封，
      否则前端无法做统一错误提示与链路追踪。
      判定：schema.required 数组须含三个字段，且 schema.properties 须声明它们。
    given: $.paths[*][*].responses[?(@property >= 400 && @property != 'default')].content['application/json'].schema
    severity: error
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [required, properties]
          properties:
            required:
              type: array
              allOf:
                - contains: { const: code }
                - contains: { const: message }
                - contains: { const: requestId }
            properties:
              type: object
              required: [code, message, requestId]
              # 注意：此处的 target 是「schema 定义」本身，而非它描述的数据。
              # 所以 properties.code 的值形如 { type: string }（对象），
              # 再往下一层断言 type === "string" 才是正确语义。
              properties:
                code:
                  type: object
                  properties:
                    type: { const: string }
                message:
                  type: object
                  properties:
                    type: { const: string }
                requestId:
                  type: object
                  properties:
                    type: { const: string }

  linkai-success-envelope-requestId:
    description: >
      2xx 响应体应携带 requestId 便于排障（SSE 流式响应可豁免）。
      判定：schema.required 数组须含 requestId 且在 properties 中声明。
    given: $.paths[*][*].responses[?(@property >= 200 && @property < 300)].content['application/json'].schema
    severity: warn
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [required, properties]
          properties:
            required:
              type: array
              contains: { const: requestId }
            properties:
              type: object
              required: [requestId]
              properties:
                requestId:
                  type: object
                  properties:
                    type: { const: string }

  # ─────────────────────────────────────────────────────────────
  # 分组 4：安全基线（架构铁律 #5）
  # ─────────────────────────────────────────────────────────────
  linkai-security-defined:
    description: 所有操作必须显式声明 security（公开接口用 publicAuth: [] 显式标注）。
    given: $.paths[*][get,post,put,patch,delete]
    severity: error
    then:
      field: security
      function: defined

  # ─────────────────────────────────────────────────────────────
  # 分组 5：可维护性与规范（warn 为主，冻结前会卡）
  # ─────────────────────────────────────────────────────────────
  linkai-path-kebab-case:
    description: 路径段使用 kebab-case，且与资源名复数保持一致。
    given: $.paths[?(@property =~ /^\//)]
    severity: warn
    then:
      function: pattern
      functionOptions:
        match: "^/(\\{[a-zA-Z]+\\}|[a-z0-9]+(-[a-z0-9]+)*)(/(\\{[a-zA-Z]+\\}|[a-z0-9]+(-[a-z0-9]+)*))*$"

  linkai-operation-summary-required:
    description: 每个操作必须有 summary，用于生成 SDK 文档与控制台提示。
    given: $.paths[*][get,post,put,patch,delete]
    severity: warn
    then:
      field: summary
      function: truthy

  linkai-operation-tags-required:
    description: 每个操作必须打 tag，便于按框架域（model/prompt/knowledge/...）分组生成。
    given: $.paths[*][get,post,put,patch,delete]
    severity: warn
    then:
      field: tags
      function: schema
      functionOptions:
        schema:
          type: array
          minItems: 1

  linkai-schema-description:
    description: 顶层 schema 需写 description，否则生成物文档不可读。
    given: $.components.schemas[*]
    severity: warn
    then:
      field: description
      function: truthy

  # ─────────────────────────────────────────────────────────────
  # 分组 6：破坏性变更防护（配合 oasdiff，此处只做静态提醒）
  # ─────────────────────────────────────────────────────────────
  linkai-deprecation-has-sunset:
    description: 标记 deprecated 的操作必须写明 x-sunset 日期，否则无法安排下线。
    given: $.paths[*][get,post,put,patch,delete][?(@.deprecated === true)]
    severity: error
    then:
      field: x-sunset
      function: truthy

  # ─────────────────────────────────────────────────────────────
  # 分组 7：继承规则调级
  # 下面这些规则名来自 spectral:oas，此处只调整严重级别，不重定义逻辑。
  # （不能自己重写：oasOpIdUnique / oasUnusedComponent 等内部函数未对外注册，
  #   在自定义 ruleset 里直接引用会报 "Function is not defined"。）
  # ─────────────────────────────────────────────────────────────
  operation-operationId-unique: error
  oas3-unused-component: hint
  operation-operationId-valid-in-url: error
  operation-tag-defined: error
  operation-success-response: error
  operation-description: warn
  info-contact: off
  info-description: warn
  license-url: off
  oas3-schema: error
  no-eval-in-markdown: error
  no-script-tags-in-markdown: error
