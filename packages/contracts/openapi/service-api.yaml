openapi: 3.1.0
info:
  title: LinkAI Service API（用户面，OpenAI 兼容）
  description: |
    对外 OpenAI 兼容接口 v0.1.2（嵌入 SDK / 渠道 / 第三方工具统一走此面）。
    鉴权：用户 API Key（Bearer）。多租户由 Key 归属解析，调用方不传 tenant。
    流式：POST /v1/chat/completions 显式传 stream=true 时返回 text/event-stream，
    事件协议见 runtime-events.yaml（node_started / message_chunk / tool_called / thought / error / human_input_required / done）；
    done 为正常终局事件（携带 usage 与 finishReason）。
    调试窗（v0.1.2 新增）：GET /v1/conversations 会话列表 + GET /v1/conversations/{conversationId}/events 执行链事件回放
    （cursor 分页风格同 console-api；事件元素为 runtime-events.yaml 的 RuntimeEvent 联合）。
  version: 0.1.2
servers:
  - url: /v1
tags:
  - name: ApiKeys
  - name: Chat
  - name: Conversations
  - name: Models
paths:
  /chat/completions:
    post:
      tags: [Chat]
      summary: 对话补全（SSE 流式）
      operationId: createChatCompletion
      security: [{ apiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCompletionRequest' }
      responses:
        '200':
          description: stream=true 时为 SSE 事件流（见 runtime-events.yaml）；stream=false 时为完整响应
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletionResponse' }
            text/event-stream:
              schema:
                type: string
                description: SSE 事件序列，每个事件 data 为 runtime-events.yaml 中定义的事件 JSON
        '429':
          description: 配额/积分不足
          content:
            application/json:
              schema: { $ref: '../schemas/common.yaml#/Error' }
  /conversations:
    get:
      tags: [Conversations]
      summary: 会话列表（调试窗，cursor 分页）
      operationId: listConversations
      security: [{ apiKeyAuth: [] }]
      description: |
        当前 API Key 所属租户下的会话列表，按更新时间倒序。cursor 分页风格与 console-api 一致
        （limit + cursor，响应 nextCursor 为空表示无更多）。调试窗用；不暴露其他租户数据。
      parameters:
        - { $ref: '../schemas/common.yaml#/CursorParam' }
        - { $ref: '../schemas/common.yaml#/LimitParam' }
      responses:
        '200':
          description: 会话分页列表
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, requestId]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Conversation' }
                  nextCursor: { type: string, nullable: true, description: 空串/null 表示无更多 }
                  requestId: { type: string, description: 链路追踪 ID（排障用） }
        '401':
          description: API Key 缺失/无效
          content:
            application/json:
              schema: { $ref: '../schemas/common.yaml#/Error' }
        '500':
          description: 服务端内部错误
          content:
            application/json:
              schema: { $ref: '../schemas/common.yaml#/Error' }
  /conversations/{conversationId}/events:
    get:
      tags: [Conversations]
      summary: 执行链事件回放（调试窗，cursor 分页）
      operationId: listConversationEvents
      security: [{ apiKeyAuth: [] }]
      description: |
        会话的执行链事件序列（乱序重放兜底：按 ts 正序 + message_chunk 的 data.seq 排序）。
        事件元素为 runtime-events.yaml 的 RuntimeEvent 联合（node_started / message_chunk /
        tool_called / thought / error / human_input_required / done），done 为正常终局。
        传 traceId 可收窄为单条执行链（某一次对话请求的完整回放）。
        跨租户或不存在的会话返回 404（不暴露存在性）。
      parameters:
        - { name: conversationId, in: path, required: true, schema: { type: string }, description: 会话 ID }
        - { name: traceId, in: query, required: false, schema: { type: string }, description: 可选——收窄到单次请求的执行链 }
        - { $ref: '../schemas/common.yaml#/CursorParam' }
        - { $ref: '../schemas/common.yaml#/LimitParam' }
      responses:
        '200':
          description: 事件分页列表（按 ts 正序）
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, requestId]
                properties:
                  items:
                    type: array
                    items: { $ref: './runtime-events.yaml#/components/schemas/RuntimeEvent' }
                  nextCursor: { type: string, nullable: true, description: 空串/null 表示无更多 }
                  requestId: { type: string, description: 链路追踪 ID（排障用） }
        '401':
          description: API Key 缺失/无效
          content:
            application/json:
              schema: { $ref: '../schemas/common.yaml#/Error' }
        '404':
          description: 会话不存在或跨租户（不暴露存在性）
          content:
            application/json:
              schema: { $ref: '../schemas/common.yaml#/Error' }
        '500':
          description: 服务端内部错误
          content:
            application/json:
              schema: { $ref: '../schemas/common.yaml#/Error' }
  /models:
    get:
      tags: [Models]
      summary: 可调用模型列表（元数据：编码/能力/价格/上下文长度）
      operationId: listModels
      security: [{ apiKeyAuth: [] }]
      responses:
        '200':
          description: 模型列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Model' } }
  /api-keys:
    get:
      tags: [ApiKeys]
      summary: API Key 列表（含活跃时间）
      operationId: listApiKeys
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Key 列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ApiKey' } }
    post:
      tags: [ApiKeys]
      summary: 创建 API Key（明文仅返回一次）
      operationId: createApiKey
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                expiresAt: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
  /api-keys/{keyId}:
    delete:
      tags: [ApiKeys]
      summary: 删除/吊销 API Key
      operationId: deleteApiKey
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: keyId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: 已删除 }
components:
  securitySchemes:
    apiKeyAuth:
      type: http
      scheme: bearer
      description: 用户 API Key
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 控制台登录态（管理 Key 用）
  schemas:
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant, tool] }
        content: { type: string }
        name: { type: string, description: role=tool 时的插件名 }
        toolCallId: { type: string }
    Conversation:
      type: object
      description: 会话（调试窗列表项）。多租户由 API Key 归属限定，仅返回本租户会话。
      required: [id, messageCount, createdAt, updatedAt]
      properties:
        id: { type: string, description: 会话 ID（chat/completions 的 conversationId 续聊同一会话） }
        appCode: { type: string, nullable: true, description: 关联应用编码 }
        title: { type: string, nullable: true, description: 会话标题（服务端按首条消息生成） }
        messageCount: { type: integer, description: 消息条数 }
        lastTraceId: { type: string, nullable: true, description: 最近一次请求的 trace ID（执行链回放入口） }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string, description: 模型编码（/v1/models 返回的 code） }
        messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
        stream: { type: boolean, default: false, description: '是否流式（SSE）。默认 false 对齐 OpenAI 惯例：不传该字段返回完整 JSON；传 true 时按 runtime-events.yaml 事件流输出，以 done 事件为正常终局' }
        temperature: { type: number, minimum: 0, maximum: 2 }
        maxTokens: { type: integer }
        appCode: { type: string, description: 指定运行的应用（可选，嵌入 SDK 场景必传） }
        conversationId: { type: string, description: 会话续聊（空则新建） }
        variables: { type: object, additionalProperties: { type: string }, description: 提示词变量值 }
    ChatCompletionResponse:
      type: object
      required: [id, created, model, choices]
      properties:
        id: { type: string }
        created: { type: integer, format: int64 }
        model: { type: string }
        usage:
          type: object
          properties:
            promptTokens: { type: integer }
            completionTokens: { type: integer }
            totalTokens: { type: integer }
            credits: { type: integer, description: 消耗积分 }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message: { $ref: '#/components/schemas/ChatMessage' }
              finishReason: { type: string, enum: [stop, length, tool_calls, error] }
    Model:
      type: object
      required: [code, name, capabilities]
      properties:
        code: { type: string, example: 'deepseek-chat' }
        name: { type: string }
        provider: { type: string, example: 'deepseek' }
        capabilities: { type: array, items: { type: string, enum: [chat, reasoning, vision, imageGen, videoGen, tts, asr, decision] } }
        contextLength: { type: integer }
        price: { type: object, properties: { inputPer1k: { type: number }, outputPer1k: { type: number }, creditPerCall: { type: integer } } }
        enabled: { type: boolean }
    ApiKey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        maskedKey: { type: string, example: 'sk-****abcd' }
        plaintextKey: { type: string, writeOnly: true, description: 创建时返回一次 }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
